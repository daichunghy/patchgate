name: Feature Request
description: Suggest an idea or enhancement for PatchGate
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new feature for PatchGate.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or workflow friction?
      placeholder: I encounter review bottlenecks when ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you considered.
    validations:
      required: false
