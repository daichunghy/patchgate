version: 2
project: PatchGate
authority:
  - PROJECT_CONSTITUTION.md
  - AGENTS.md
human_plan: docs/agent-execution-plan.md
product_requirements: docs/product/user-requirements.md
status: local_core_verified_publication_pending
status_note: G1 is locally technically verified. G0 publication authority is pending maintainer decisions; live GitHub and user-flow evidence remain absent.

rules:
  - Read PROJECT_CONSTITUTION.md completely before substantive work.
  - Do not mark live or integration work complete from static tests alone.
  - Do not execute pull-request code in the trusted metadata or decision lane.
  - Do not infer enforceable rules from prose discovery sources.
  - Do not hand-edit generated dist artifacts; rebuild them from source.
  - Record commands, outputs, residual gaps, and handoff IDs.
  - Map user-facing work to UR IDs and report its validation level.
  - Default rollout to local or shadow mode before maintainer-authorized enforcement.
  - Do not report static QA as a native user flow, shadow pilot, or enforcement pilot.
  - External recruitment contact installation enforcement and publication require explicit maintainer authorization.

gates:
  G0:
    name: Public project foundation
    requires_human_decision: true
    work_packages: [PG-001, PG-002, PG-003, PG-004, PG-005, PG-006, PG-007, PG-008, PG-009]
    exit:
      - public repository exists
      - OSI license is detected
      - community health files exist
      - CI passes on a pull request
      - secret scan passes
      - public feedback and private security routes are usable
      - early-user research protocol and consent-safe evidence log exist
  G1:
    name: Deterministic runtime contract
    work_packages: [PG-101, PG-102, PG-103, PG-104, PG-105, PG-106, PG-107, PG-108, PG-109, PG-110]
    exit:
      - malformed input cannot reach the evaluator
      - decision digest excludes audit and delivery timestamps
      - receipt validates against the complete schema
      - duplicate stale and foreign evidence cannot pass
      - incomplete decision-bearing observations cannot create a ready result
      - compatibility fixture manifest has no orphan or unasserted fixture
    technical_status: locally_verified
  G2:
    name: Useful local preflight
    depends_on: [G1]
    work_packages: [PG-201, PG-202, PG-203, PG-204, PG-205, PG-206, PG-207, PG-208, PG-209, PG-210, PG-211, PG-212]
    exit:
      - git-ref preflight works on fixture repositories
      - discovery cannot silently become enforcement
      - ambiguity and conflicts have remediation
      - safe draft initialization and configuration diagnosis work
      - text and JSON views remain semantically aligned
      - at least three task-based usability sessions map findings to backlog decisions
  G3:
    name: Authenticated GitHub adapter
    depends_on: [G1]
    work_packages: [PG-301, PG-302, PG-303, PG-304, PG-305, PG-306, PG-307, PG-308, PG-309, PG-310, PG-311, PG-312, PG-313, PG-314, PG-315]
    exit:
      - mocked API integration suite passes
      - pagination and permission gaps fail closed
      - read-only live smoke test passes
      - TOCTOU identity changes discard the result
      - capability doctor explains permission and unsupported-state impact by requirement
      - request page retry and rate-limit budgets are recorded and bounded
  G4:
    name: Safe shadow-mode GitHub Action
    depends_on: [G0, G2, G3]
    work_packages: [PG-401, PG-402, PG-403, PG-404, PG-405, PG-406, PG-407, PG-408, PG-409, PG-410, PG-411, PG-412, PG-413, PG-414]
    exit:
      - clean consumer repository runs the bundled Action
      - fork and merge-group E2E cases pass
      - privileged lanes never execute pull-request code
      - delivery updates one check without default comment spam
      - two consenting repositories complete non-blocking shadow evaluation
  G5:
    name: Adversarial hardening and opt-in enforcement
    depends_on: [G4]
    work_packages: [PG-501, PG-502, PG-503, PG-504, PG-505, PG-506, PG-507, PG-508, PG-509, PG-510, PG-511, PG-512, PG-513, PG-514]
    exit:
      - TG-01 through TG-16 map to passing tests
      - no P0 or P1 security waiver remains
      - performance and abuse budgets pass
      - maintainers review shadow evidence before authorizing required-check enforcement
  G6:
    name: Public beta
    depends_on: [G5]
    work_packages: [PG-601, PG-602, PG-603, PG-604, PG-605, PG-606, PG-607, PG-608, PG-609, PG-610, PG-611, PG-612]
    exit:
      - v0.1.0-beta.1 immutable release exists
      - clean install and rollback pass
      - known limitations and permissions are documented
      - compatibility upgrade rollback and redacted support paths pass clean-room tests
  G7:
    name: External pilots
    depends_on: [G6]
    work_packages: [PG-701, PG-702, PG-703, PG-704, PG-705, PG-706]
    exit:
      - two external public repositories complete the pilot protocol
      - feedback maps to issues fixtures or documentation
      - no false green is observed
      - pilot repositories are materially different and enforcement was explicitly consented
      - usefulness and usability outcomes are reported with raw counts and context
  G8:
    name: v0.1 and Codex for Open Source dossier
    depends_on: [G7]
    work_packages: [PG-801, PG-802, PG-803, PG-804]
    exit:
      - v0.1.0 satisfies PROJECT_CONSTITUTION.md
      - application evidence index contains only verifiable claims
      - maintainer reviews and submits the application manually

work_packages:
  PG-001:
    title: Confirm owner repository slug and publishing authority
    lane: maintainer
    human_only: true
    outputs: [recorded owner decision]
  PG-002:
    title: Initialize Git history and baseline main branch
    lane: release
    depends_on: [PG-001]
    paths: [.gitignore, package.json, README.md]
    acceptance: [git status --short --branch]
  PG-003:
    title: Select and add an OSI license
    lane: maintainer
    human_only: true
    outputs: [LICENSE]
  PG-004:
    title: Add community health and contribution surfaces
    lane: release
    depends_on: [PG-003]
    paths: [CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, SUPPORT.md, .github]
  PG-005:
    title: Add baseline CI and package smoke test
    lane: release
    paths: [.github/workflows/ci.yml, package.json]
    acceptance: [npm run verify, npm run build]
  PG-006:
    title: Configure default branch ruleset after CI stabilization
    lane: maintainer
    human_only: true
    depends_on: [PG-005]
  PG-007:
    title: Publish the reviewed repository to a public remote
    lane: maintainer
    human_only: true
    depends_on: [PG-002, PG-003, PG-004, PG-005]
  PG-008:
    title: Create a consent-safe user research protocol
    lane: product
    paths: [docs/product, docs/pilots]
    acceptance:
      - no participant identity or quote is published without consent
      - task evidence distinguishes invitation session shadow and enforcement
  PG-009:
    title: Recruit candidate maintainers for preflight tasks and later shadow pilots
    lane: pilot
    human_only: true
    depends_on: [PG-008]
    paths: [docs/pilots]
    acceptance:
      - candidate log distinguishes invitation consent session shadow and enforcement states
      - recruitment does not claim adoption or active use

  PG-101:
