    lane: policy
    depends_on: [PG-101]
    paths: [src/policy, schemas, test/unit]
  PG-107:
    title: Resolve duplicate check candidates without first-match behavior
    lane: contract
    paths: [src/evidence/source-verifier.ts, src/evaluator, test/unit]
  PG-108:
    title: Add observation completeness permission and provenance metadata
    lane: contract
    depends_on: [PG-101, PG-102, PG-103, PG-104]
    paths: [src/types.ts, src/contract, src/evidence, schemas, fixtures, test]
    acceptance:
      - complete sufficient unavailable and permission-limited states are distinct
      - normalized observation digests bind metadata to their item collections
      - incomplete collections cannot be hidden by a passing item
    implementation_evidence:
      - src/types.ts
      - src/contract/validation.ts
      - test/fixture.test.ts
      - test/evaluator.test.ts
  PG-109:
    title: Distinguish confirmed failure from missing evidence by rule dependency
    lane: contract
