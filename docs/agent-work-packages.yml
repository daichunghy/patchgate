  PG-102:
    title: Enforce runtime validation at current CLI and reusable snapshot boundaries
    lane: contract
    depends_on: [PG-101]
    paths: [src/cli.ts, src/contract, test]
    acceptance:
      - every current external CLI input validates before pure evaluation
      - one reusable validation boundary is exposed for future adapters
      - Action boundary remains owned by PG-403 and cannot be claimed before it exists
  PG-103:
